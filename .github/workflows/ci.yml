name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  eval:
    name: Retrieval eval (precision@1 + refusal)
    runs-on: ubuntu-latest
    # The eval downloads a sentence-transformer via @xenova/transformers, so keep
    # it off the PR path and run it on main and on demand only.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run eval harness
        run: npx tsx scripts/eval.ts | tee eval-output.txt
      - name: Assert hybrid retrieval has not regressed
        run: |
          # Last line of each block is "precision@1 (labeled): H/N = P%   |   refusal: R/T".
          # The second occurrence is the hybrid run.
          hybrid=$(grep 'precision@1' eval-output.txt | tail -1)
          echo "hybrid line: $hybrid"
          pct=$(echo "$hybrid" | sed -E 's/.*= ([0-9]+)%.*/\1/')
          ref_ok=$(echo "$hybrid" | sed -E 's#.*refusal: ([0-9]+)/([0-9]+).*#\1#')
          ref_total=$(echo "$hybrid" | sed -E 's#.*refusal: ([0-9]+)/([0-9]+).*#\2#')
          echo "precision@1=${pct}%  refusal=${ref_ok}/${ref_total}"
          # Baseline recorded in BENCHMARKS.md: 79% precision@1, 3/3 refusal.
          [ "$pct" -ge 79 ] || { echo "REGRESSION: precision@1 ${pct}% < 79% baseline"; exit 1; }
          [ "$ref_ok" -eq "$ref_total" ] || { echo "REGRESSION: refusal ${ref_ok}/${ref_total}"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-output
          path: eval-output.txt
